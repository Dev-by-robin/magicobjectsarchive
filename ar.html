<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Objects Archive - AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ar.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
</head>
<body>

  <div id="ar-laad-scherm">
    <div class="laad-logo">MAGIC OBJECTS<br>ARCHIVE</div>
    <div class="laad-scan-lijn"></div>
    <div class="laad-status">AR SYSTEEM LADEN</div>
    <div class="laad-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <nav>
    <div class="nav-logo">MAGIC OBJECTS ARCHIVE</div>
    <div class="nav-knoppen">
      <a href="index.html" class="nav-knop">Home</a>
      <span class="nav-knop actief">AR</span>
    </div>
  </nav>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- 3D modellen alvast inladen -->
    <a-assets>
      <a-asset-item id="model-thing"   src="models/thing_-_addams_family.glb"></a-asset-item>
      <a-asset-item id="model-crystal" src="models/crystal_ball.glb"></a-asset-item>
      <a-asset-item id="model-basement" src="models/land_of_dreamsch_basement_a_-_concept.glb"></a-asset-item>
    </a-assets>

    <!-- Thing -->
    <a-entity id="obj-thing" position="-2 0 -10">
      <!-- Hitbox voor raycasting (onzichtbaar) -->
      <a-box
        class="clickable"
        width="1" height="1.5" depth="1"
        position="-2 -1.5 -8"
        material="opacity: 0; transparent: true; side: double">
      </a-box>
      <!-- 3D model -->
      <a-gltf-model
        src="#model-thing"
        scale="0.01 0.01 0.01"
        position="-2 -1.5 -8"
        rotation="0 0 0">
      </a-gltf-model>
      <a-entity
        light="type: point; color: #e6c200; intensity: 5; distance: 3; decay: 2"
        position="-2 0 -6">
      </a-entity>
      <a-entity troika-text="value: THING; font: https://cdn.jsdelivr.net/npm/@fontsource/cinzel/files/cinzel-latin-400-normal.woff; fontSize: 0.15; color: #e6c200; anchorX: center; anchorY: middle; letterSpacing: 0.05; fillOpacity: 0.9;" position="0 -1 1"></a-entity>
    </a-entity>

    <!-- Crystal Ball -->
    <a-entity id="obj-crystal" position="2 0 -10">
      <!-- Hitbox voor raycasting (onzichtbaar) -->
      <a-box
        class="clickable"
        width="2" height="2.5" depth="1"
        position="0 -2.5 -12"
        material="opacity: 0; transparent: true; side: double">
      </a-box>
      <!-- 3D model -->
      <a-gltf-model
        src="#model-crystal"
        scale="0.01 0.01 0.01"
        position="0 -2.5 -9.5"
        rotation="0 0 0">
      </a-gltf-model>
      <a-entity
        light="type: point; color: #e6c200; intensity: 5; distance: 3; decay: 2"
        position="0 -2.5 -9.5">
      </a-entity>
      <a-entity troika-text="value: CRYSTAL BALL; font: https://cdn.jsdelivr.net/npm/@fontsource/cinzel/files/cinzel-latin-400-normal.woff; fontSize: 0.15; color: #e6c200; anchorX: center; anchorY: middle; letterSpacing: 0.05; fillOpacity: 0.9;" position="-1.1 -1.7 1.1"></a-entity>
      <a-entity troika-text="value: MAGIC OBJECTS\n         ARCHIVE; font: https://cdn.jsdelivr.net/npm/@fontsource/nosifer/files/nosifer-latin-400-normal.woff; fontSize: 0.2; color: red; anchorX: center; anchorY: middle; letterSpacing: 0.05; fillOpacity: 0.5; maxWidth: 6;" position="-2.4 2.2 -10"></a-entity>
    </a-entity>

    <!-- Basement -->
    <a-entity id="obj-basement" position="0 0 0">
      <a-gltf-model
        src="#model-basement"
        scale="0.05 0.05 0.05"
        position="19 -8 5" 
        rotation="0 0 0">
      </a-gltf-model>
      <a-entity
        light="type: point; color: red; intensity: 3; distance: 10; decay: 2"
        position="-5 0 -8">
      </a-entity>
      <a-entity
        light="type: point; color: purple; intensity: 3; distance: 10; decay: 2"
        position="5 0 -8">
      </a-entity>
      <a-entity
        light="type: point; color: blue; intensity: 0.4; distance: 10; decay: 2"
        position="0 0 -20">
      </a-entity>

      
      
    </a-entity>

    <!-- Donkere sfeerlicht -->
    <a-entity light="type: ambient; color: #111111; intensity: 0.4"></a-entity>
    <a-entity light="type: directional; color: #5A4B8A; intensity: 0.5" position="-1 2 -1"></a-entity>
    <a-entity light="type: directional; color: #262A44; intensity: 0.25" position="1 0.5 1"></a-entity>

    <!-- Camera met gyroscoop + raycaster -->
    <a-entity
      camera
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true;"
      raycaster="objects: .clickable; far: 100; interval: 100;">
        <!-- <a-entity
          cursor="fuse: false"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.003; radiusOuter: 0.005"
          material="color: #E63232; shader: flat">
        </a-entity> -->
    </a-entity>

  </a-scene>

  <!-- Overlay -->
  <div id="ar-overlay">

    <button class="ar-terug-knop" onclick="history.back()">&#8592;</button>
    <div class="ar-status">AR ACTIEF</div>
    <div class="ar-crosshair"></div>

    <div id="orientatie-permissie" style="display:none;">
      <p>Geef toegang tot de bewegingssensor</p>
      <button onclick="vraagOrientatie()">Toestemming geven</button>
    </div>

    <div id="ar-tik-hint" style="display:none;">TIK OM TE OPENEN</div>

    <div class="ar-instructie" id="ar-instructie">
      Richt op een object
      <span>En bekijk alle details</span>
    </div>

    <div class="ar-paneel" id="ar-paneel" style="display:none;"></div>

    <div class="ar-beweging">
      <button class="beweging-knop beweging-voor"
        ontouchstart="startBeweging('voor')" ontouchend="stopBeweging('voor')"
        onmousedown="startBeweging('voor')" onmouseup="stopBeweging('voor')" onmouseleave="stopBeweging('voor')">↑</button>
      <div class="beweging-rij">
        <button class="beweging-knop"
          ontouchstart="startBeweging('links')" ontouchend="stopBeweging('links')"
          onmousedown="startBeweging('links')" onmouseup="stopBeweging('links')" onmouseleave="stopBeweging('links')">←</button>
        <div class="beweging-midden"></div>
        <button class="beweging-knop"
          ontouchstart="startBeweging('rechts')" ontouchend="stopBeweging('rechts')"
          onmousedown="startBeweging('rechts')" onmouseup="stopBeweging('rechts')" onmouseleave="stopBeweging('rechts')">→</button>
      </div>
      <button class="beweging-knop beweging-achter"
        ontouchstart="startBeweging('achter')" ontouchend="stopBeweging('achter')"
        onmousedown="startBeweging('achter')" onmouseup="stopBeweging('achter')" onmouseleave="stopBeweging('achter')">↓</button>
    </div>
  </div>

  <script src="ar.js"></script>
</body>
</html>
