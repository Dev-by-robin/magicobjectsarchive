<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Objects Archive - AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ar.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <nav>
    <div class="nav-logo">MAGIC OBJECTS ARCHIVE</div>
    <div class="nav-knoppen">
      <a href="index.html" class="nav-knop">Home</a>
      <span class="nav-knop actief">AR</span>
    </div>
  </nav>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Thing: rode hand – links -->
    <a-entity id="obj-thing" position="-2 0 -4">
      <!-- Onzichtbare hitbox zodat de raycaster het object kan raken -->
      <a-box
        class="clickable"
        width="0.8" height="1.2" depth="0.4"
        position="0 0.2 0"
        material="opacity: 0; transparent: true; side: double">
      </a-box>
      <!-- Visuele onderdelen -->
      <a-box color="#C0392B" width="0.35" height="0.45" depth="0.1" position="0 0 0"></a-box>
      <a-box color="#C0392B" width="0.07" height="0.28" depth="0.09" position="-0.12 0.36 0"></a-box>
      <a-box color="#C0392B" width="0.07" height="0.32" depth="0.09" position="-0.04 0.38 0"></a-box>
      <a-box color="#C0392B" width="0.07" height="0.30" depth="0.09" position="0.04 0.37 0"></a-box>
      <a-box color="#C0392B" width="0.07" height="0.24" depth="0.09" position="0.12 0.34 0"></a-box>
      <a-box color="#C0392B" width="0.16" height="0.07" depth="0.09" position="-0.25 0.06 0"></a-box>
      <a-text value="THING" position="0 -0.5 0.1" align="center" color="white" width="3"></a-text>
    </a-entity>

    <!-- Crystal Ball: paarse bol – rechts -->
    <a-entity id="obj-crystal" position="2 0 -4">
      <!-- Onzichtbare hitbox -->
      <a-sphere
        class="clickable"
        radius="0.35"
        material="opacity: 0; transparent: true; side: double">
      </a-sphere>
      <!-- Visuele onderdelen -->
      <a-sphere color="#9561D0" radius="0.28" opacity="0.3"></a-sphere>
      <a-sphere color="#9561D0" radius="0.22" opacity="0.85"></a-sphere>
      <a-sphere color="#C39EE8" radius="0.12" opacity="0.9"></a-sphere>
      <a-text value="CRYSTAL BALL" position="0 -0.5 0.1" align="center" color="white" width="3"></a-text>
    </a-entity>

    <!-- Camera met gyroscoop + raycaster op .clickable elementen -->
    <a-entity
      camera
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false;"
      raycaster="objects: .clickable; far: 100; interval: 100;">
      <!-- Visuele ring cursor -->
      <a-entity
        cursor="fuse: false"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
        material="color: #E63232; shader: flat">
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- Overlay -->
  <div id="ar-overlay">
    <div class="hoek lo"></div>
    <div class="hoek ro"></div>
    <div class="hoek lo2"></div>
    <div class="hoek ro2"></div>

    <div class="ar-status">● AR ACTIEF</div>
    <div class="ar-crosshair"></div>

    <div id="orientatie-permissie" style="display:none;">
      <p>Geef toegang tot de bewegingssensor</p>
      <button onclick="vraagOrientatie()">Toestemming geven</button>
    </div>

    <div class="ar-instructie" id="ar-instructie">
      Richt op een object
      <span>Kijk naar Thing of Crystal Ball</span>
    </div>

    <div class="ar-paneel" id="ar-paneel" style="display:none;"></div>
  </div>

  <script src="ar.js"></script>
</body>
</html>
